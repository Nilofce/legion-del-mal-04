name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs: 
      villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Magneto
          - Brainiac
          - Darkseid
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"
        type: string
      
      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🔴 Alta
          - 🟡 Media
          - 🟢 Baja
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    
    steps:
      - name: Imprimir inputs
        run: | 
          echo "El villano ${{ inputs.villano }} "
          echo "Nivel de prioridad: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
