name: Comunicador de la Legión del Mal

on:
  workflow_dispatch:
    inputs: 
      villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Magneto
          - Brainiac
          - Darkseid
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"
        type: string
      
      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🔴 Alta
          - 🟡 Media
          - 🟢 Baja

      cowsay_model:
        description: "¿Qué diseño de mensaje quieres?"
        required: true
        type: choice
        options:
          - charizardvice
          - eyes
          - dragon
          - ghostbusters

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    
    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay
          
      - name: Imprimir inputs
        run: |  
          echo "================================"
          echo "   Transmisión interceptada"
          echo "================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "----- Mensaje -----"
          cowsay -f "${{ inputs.cowsay_model }}" "${{ inputs.mensaje }}"
          echo ""
          echo "--- ${{ inputs.villano }}"
          echo "..."
          
          
          