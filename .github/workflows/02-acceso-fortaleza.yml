name: 🗻 Acceso a la fortaleza prohibida
on: push 

jobs: 
    acceso-a-la-base:
        runs-on: ubuntu-latest
        
        steps:
            - name: El agente llega a la fortaleza
              run: |
               echo "Agente ${{ github.actor }} ha llegado a la fortaleza"
               echo ""
               echo "Buscar los archivos de la Legión"
               ls -la
               echo ""
               echo "❌ pero qué pasó? No hay nada"
            
            - name: 'Brainiac te otorga permiso para acceder'
              uses: actions/checkout@v4
            
            - name: 'Ahora sí, vamos a ver los planes'
              run: |
               ls -la
               echo "✅ Ahora sí, hay archivos"
               echo ""
               echo "Planes:"
               ls planes/
               echo "Villanos:"
               ls miembros/
               echo "Inteligencia:"
               ls inteligencia/ 